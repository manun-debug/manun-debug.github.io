<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>A Little Question 💕</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100svh;

    overflow: hidden;

    font-family: "DM Sans", sans-serif;
    color: #4d3941;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,.95),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 15%,
            rgba(255,196,216,.48),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(255,218,230,.75),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #fff5f8,
            #ffe5ef,
            #fce8f0
        );

    display: flex;
    align-items: center;
    justify-content: center;

    padding:
        max(15px, env(safe-area-inset-top))
        max(15px, env(safe-area-inset-right))
        max(15px, env(safe-area-inset-bottom))
        max(15px, env(safe-area-inset-left));

    position: relative;
}


/* =========================================================
   BACKGROUND ORBS
========================================================= */

.background-orb {
    position: fixed;

    border-radius: 50%;

    filter: blur(55px);

    pointer-events: none;

    opacity: .55;
}

.orb1 {
    width: 220px;
    height: 220px;

    background: #ffd2e2;

    top: -70px;
    left: -50px;
}

.orb2 {
    width: 260px;
    height: 260px;

    background: #e9d6ff;

    right: -80px;
    top: 25%;
}

.orb3 {
    width: 230px;
    height: 230px;

    background: #ffd9d9;

    bottom: -70px;
    left: 25%;
}


/* =========================================================
   FLOATING HEARTS
========================================================= */

.floating {
    position: fixed;

    pointer-events: none;

    z-index: 1;

    animation: floatUp linear infinite;

    opacity: 0;
}

@keyframes floatUp {

    0% {
        transform:
            translateY(110svh)
            rotate(0deg);

        opacity: 0;
    }

    10% {
        opacity: .7;
    }

    80% {
        opacity: .6;
    }

    100% {
        transform:
            translateY(-15svh)
            rotate(360deg);

        opacity: 0;
    }
}


/* =========================================================
   MAIN CARD
========================================================= */

.card {
    width: min(680px, 100%);

    min-height: min(560px, 90svh);

    padding: 55px 45px;

    border-radius: 35px;

    background:
        rgba(255,255,255,.54);

    border:
        1px solid rgba(255,255,255,.78);

    box-shadow:
        0 30px 80px rgba(139,75,102,.15),
        inset 0 1px 0 rgba(255,255,255,.8);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    text-align: center;

    position: relative;

    z-index: 10;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    animation:
        cardAppear 1.1s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform:
            translateY(30px)
            scale(.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   HEADING
========================================================= */

.small-title {
    font-size: 13px;

    text-transform: uppercase;

    letter-spacing: 4px;

    color: #b47791;

    margin-bottom: 18px;

    font-weight: 600;
}

h1 {
    font-family: "Playfair Display", serif;

    font-size:
        clamp(38px, 7vw, 65px);

    line-height: 1.05;

    color: #49333b;

    margin-bottom: 25px;
}

.heart-main {
    display: inline-block;

    animation:
        heartbeat 1.6s infinite;
}

@keyframes heartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.15);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.1);
    }
}


/* =========================================================
   MESSAGE
========================================================= */

.message {
    min-height: 110px;

    max-width: 570px;

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(20px, 3vw, 27px);

    line-height: 1.55;

    color: #674b56;

    margin-bottom: 38px;
}

.cursor {
    display: inline-block;

    width: 2px;

    height: 1.1em;

    background: #b47791;

    margin-left: 3px;

    vertical-align: middle;

    animation:
        blink .8s infinite;
}

@keyframes blink {

    50% {
        opacity: 0;
    }
}


/* =========================================================
   BUTTON AREA
========================================================= */

.buttons {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 18px;

    min-height: 65px;

    position: relative;

    width: 100%;
}

button {
    border: none;

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 16px;

    font-weight: 700;

    padding: 16px 34px;

    border-radius: 100px;

    cursor: pointer;

    -webkit-tap-highlight-color:
        transparent;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        opacity .25s ease;
}

button:active {
    transform: scale(.94);
}

button:disabled {
    cursor: default;
}


/* =========================================================
   YES BUTTON
========================================================= */

.yes-btn {
    color: white;

    background:
        linear-gradient(
            135deg,
            #e98baa,
            #c96c91
        );

    box-shadow:
        0 12px 25px
        rgba(201,108,145,.3);
}

.yes-btn:hover {
    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 16px 32px
        rgba(201,108,145,.4);
}


/* =========================================================
   NO BUTTON
========================================================= */

.no-btn {
    color: #8b6875;

    background:
        rgba(255,255,255,.82);

    border:
        1px solid
        rgba(205,153,173,.25);

    box-shadow:
        0 8px 20px
        rgba(120,80,100,.08);
}

.no-btn:hover {
    transform:
        translateY(-2px);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 35px;

    font-size: 12px;

    color: #aa8393;

    letter-spacing: .5px;
}


/* =========================================================
   PLEASE MODAL
========================================================= */

.modal {
    position: fixed;

    inset: 0;

    background:
        rgba(70,35,50,.28);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .35s ease;

    padding: 25px;
}

.modal.show {
    opacity: 1;

    pointer-events: auto;
}

.modal-box {
    width:
        min(430px, 100%);

    padding: 45px 30px;

    border-radius: 32px;

    background:
        rgba(255,255,255,.92);

    border:
        1px solid
        rgba(255,255,255,.95);

    box-shadow:
        0 35px 90px
        rgba(70,35,50,.25);

    text-align: center;

    animation:
        modalPop .45s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes modalPop {

    from {
        transform: scale(.75);

        opacity: 0;
    }

    to {
        transform: scale(1);

        opacity: 1;
    }
}

.modal-emoji {
    font-size: 55px;

    margin-bottom: 12px;

    animation:
        tinyBounce 1.5s infinite;
}

@keyframes tinyBounce {

    50% {
        transform:
            translateY(-7px);
    }
}

.modal-box h2 {
    font-family:
        "Playfair Display",
        serif;

    font-size: 38px;

    margin-bottom: 10px;
}

.modal-box p {
    color: #8d6c79;

    margin-bottom: 25px;
}

.modal-buttons {
    display: flex;

    justify-content: center;

    gap: 14px;
}


/* =========================================================
   BUBBLE LAYER
========================================================= */

#bubbleLayer {
    position: fixed;

    inset: 0;

    z-index: 200;

    pointer-events: none;

    overflow: hidden;

    display: none;
}

#bubbleLayer.active {
    display: block;
}

.bubble {
    position: absolute;

    width: var(--size);

    height: var(--size);

    left: var(--x);

    top: var(--y);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.96) 0%,
            rgba(255,255,255,.5) 10%,
            rgba(255,190,215,.45) 35%,
            rgba(255,160,200,.25) 70%,
            rgba(255,255,255,.15) 100%
        );

    border:
        1px solid
        rgba(255,255,255,.8);

    box-shadow:
        inset -4px -5px 12px
        rgba(220,110,160,.1),

        inset 4px 5px 10px
        rgba(255,255,255,.8),

        0 5px 20px
        rgba(220,120,170,.12);

    animation:
        bubbleFly
        var(--duration)
        cubic-bezier(.15,.8,.2,1)
        forwards;
}

.bubble::after {
    content: "";

    position: absolute;

    width: 20%;

    height: 20%;

    border-radius: 50%;

    background:
        rgba(255,255,255,.85);

    top: 17%;

    left: 20%;
}

@keyframes bubbleFly {

    0% {
        transform:
            translate(
                var(--startX),
                var(--startY)
            )
            scale(.1);

        opacity: 0;
    }

    15% {
        opacity: .95;
    }

    45% {
        transform:
            translate(
                var(--midX),
                var(--midY)
            )
            scale(1);
    }

    100% {
        transform:
            translate(
                var(--endX),
                var(--endY)
            )
            scale(.15);

        opacity: 0;
    }
}


/* =========================================================
   BURST RING
========================================================= */

.burst-ring {
    position: fixed;

    width: 40px;

    height: 40px;

    border-radius: 50%;

    border:
        3px solid
        rgba(255,255,255,.9);

    pointer-events: none;

    z-index: 205;

    animation:
        burstRing .65s ease-out
        forwards;
}

@keyframes burstRing {

    from {
        transform:
            translate(-50%,-50%)
            scale(.3);

        opacity: 1;
    }

    to {
        transform:
            translate(-50%,-50%)
            scale(8);

        opacity: 0;
    }
}


/* =========================================================
   TRANSFORMATION MESSAGE
========================================================= */

.transformation-message {
    position: fixed;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    z-index: 250;

    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(30px,7vw,70px);

    color: white;

    text-shadow:
        0 4px 20px
        rgba(110,50,80,.3);

    opacity: 0;

    pointer-events: none;

    white-space: nowrap;
}

.transformation-message.show {
    animation:
        messageTransform
        2.2s ease forwards;
}

@keyframes messageTransform {

    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.6);
    }

    25% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }

    75% {
        opacity: 1;
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }
}


/* =========================================================
   SUCCESS SCREEN
========================================================= */

.success-screen {
    position: fixed;

    inset: 0;

    z-index: 300;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.98),
            rgba(255,226,237,.97)
        );

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .5s ease;
}

.success-screen.show {
    opacity: 1;

    pointer-events: auto;
}

.success-content {
    animation:
        successAppear
        .8s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes successAppear {

    from {
        transform:
            scale(.5)
            translateY(30px);

        opacity: 0;
    }

    to {
        transform:
            scale(1)
            translateY(0);

        opacity: 1;
    }
}

.success-heart {
    font-size: 90px;

    animation:
        heartbeat .9s infinite,
        successFloat 2s
        ease-in-out infinite;
}

@keyframes successFloat {

    50% {
        transform:
            translateY(-10px);
    }
}

.success-content h2 {
    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(55px,12vw,110px);

    color: #d16d94;

    margin: 10px 0;
}

.success-content p {
    font-family:
        "Playfair Display",
        serif;

    font-size:
        clamp(22px,5vw,34px);

    color: #654552;
}


/* =========================================================
   PLANS POPUP
========================================================= */

.plans-popup {
    position: fixed;

    left: 50%;

    bottom:
        max(30px, env(safe-area-inset-bottom));

    transform:
        translate(-50%,150px);

    width:
        min(500px, calc(100% - 40px));

    padding: 25px;

    border-radius: 25px;

    background:
        rgba(255,255,255,.94);

    border:
        1px solid
        rgba(255,255,255,.9);

    box-shadow:
        0 20px 60px
        rgba(100,50,75,.2);

    z-index: 400;

    text-align: center;

    opacity: 0;

    transition:
        transform .6s
        cubic-bezier(.2,.8,.2,1),
        opacity .5s ease;
}

.plans-popup.show {
    transform:
        translate(-50%,0);

    opacity: 1;
}

.plans-popup .mini {
    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 3px;

    color: #b47791;

    margin-bottom: 7px;
}

.plans-popup h3 {
    font-family:
        "Playfair Display",
        serif;

    font-size: 25px;

    margin-bottom: 17px;
}

.plans-popup button {
    padding:
        11px 25px;
}


/* =========================================================
   CONFETTI
========================================================= */

.confetti {
    position: fixed;

    width: 9px;

    height: 14px;

    top: -20px;

    z-index: 350;

    pointer-events: none;

    animation:
        confettiFall
        linear forwards;
}

@keyframes confettiFall {

    0% {
        transform:
            translateY(0)
            rotate(0deg);
    }

    100% {
        transform:
            translateY(110svh)
            rotate(720deg);

        opacity: 0;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {
        padding:
            max(12px, env(safe-area-inset-top))
            max(12px, env(safe-area-inset-right))
            max(12px, env(safe-area-inset-bottom))
            max(12px, env(safe-area-inset-left));
    }

    .card {

        min-height: 0;

        height:
            min(
                calc(100svh - 24px),
                650px
            );

        padding:
            35px 20px;

        border-radius: 28px;
    }

    .small-title {
        font-size: 11px;
        letter-spacing: 3px;
    }

    h1 {
        font-size: 42px;
    }

    .message {
        font-size: 21px;

        min-height: 125px;

        margin-bottom: 25px;
    }

    .buttons {
        gap: 10px;
    }

    button {
        padding:
            14px 24px;

        font-size: 15px;
    }

    .footer {
        margin-top: 25px;
    }

    .modal-box {
        padding:
            38px 22px;
    }

    .modal-box h2 {
        font-size: 35px;
    }

    .modal-buttons {
        gap: 10px;
    }

    .modal-buttons button {
        padding:
            13px 23px;
    }
}


/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media (max-height: 650px) {

    .card {
        padding-top: 25px;
        padding-bottom: 25px;
    }

    .small-title {
        margin-bottom: 10px;
    }

    h1 {
        margin-bottom: 15px;
    }

    .message {
        min-height: 95px;
        margin-bottom: 20px;
        font-size: 19px;
    }

    .footer {
        margin-top: 18px;
    }
}

</style>
</head>


<body>

<!-- =======================================================
     BACKGROUND
======================================================= -->

<div class="background-orb orb1"></div>
<div class="background-orb orb2"></div>
<div class="background-orb orb3"></div>


<!-- =======================================================
     MAIN CARD
======================================================= -->

<main class="card">

    <div class="small-title">
        A little question
    </div>

    <h1>
        Hey you <span class="heart-main">♡</span>
    </h1>

    <div class="message">
        <span id="typewriter"></span>
        <span class="cursor"></span>
    </div>

    <div class="buttons">

        <button
            id="yesBtn"
            class="yes-btn"
            onclick="sayYes()">

            YES 💕
        </button>

        <button
            id="noBtn"
            class="no-btn"
            onclick="tryNo()">

            NO 🙈
        </button>

    </div>

    <div class="footer">
        Be honest... but choose carefully 👀
    </div>

</main>


<!-- =======================================================
     PLEASE MODAL
======================================================= -->

<div
    id="pleaseModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-emoji">
            🥺
        </div>

        <h2>
            Please?
        </h2>

        <p>
            Just one little date...
            pretty please? 🥺💕
        </p>

        <div class="modal-buttons">

            <button
                class="yes-btn"
                onclick="sayYes()">

                YES 🥰
            </button>

            <button
                class="no-btn"
                onclick="modalNo()">

                NO 😭
            </button>

        </div>

    </div>

</div>


<!-- =======================================================
     BUBBLE EFFECT
======================================================= -->

<div id="bubbleLayer"></div>


<!-- =======================================================
     TRANSFORMATION MESSAGE
======================================================= -->

<div
    id="transformationMessage"
    class="transformation-message">

    Wait... what?! 🫧

</div>


<!-- =======================================================
     SUCCESS SCREEN
======================================================= -->

<div
    id="successScreen"
    class="success-screen">

    <div class="success-content">

        <div class="success-heart">
            💕
        </div>

        <h2>
            YAY!
        </h2>

        <p>
            It's a date! 🥰
        </p>

    </div>

</div>


<!-- =======================================================
     PLANS POPUP
======================================================= -->

<div
    id="plansPopup"
    class="plans-popup">

    <div class="mini">
        One last thing...
    </div>

    <h3>
        Text me... to know plans 💕
    </h3>

    <button
        class="yes-btn"
        onclick="closePlans()">

        Okay 🥰

    </button>

</div>


<script>

/* =========================================================
   TYPEWRITER
========================================================= */

const proposalText =
"I’ve been trying to focus all day, but I keep getting distracted by how much I want to take you out. Will you go on a date with me?";

const typewriter =
document.getElementById("typewriter");

let typeIndex = 0;

function typeText() {

    if (
        typeIndex <
        proposalText.length
    ) {

        typewriter.textContent +=
            proposalText.charAt(
                typeIndex
            );

        typeIndex++;

        setTimeout(
            typeText,
            38
        );
    }
}

setTimeout(
    typeText,
    700
);


/* =========================================================
   FLOATING HEARTS
========================================================= */

const symbols = [
    "♡",
    "♥",
    "✦",
    "✧",
    "·"
];

function createFloatingElements() {

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        const element =
            document.createElement("div");

        element.className =
            "floating";

        element.textContent =
            symbols[
                Math.floor(
                    Math.random() *
                    symbols.length
                )
            ];

        element.style.left =
            Math.random() * 100 +
            "vw";

        element.style.fontSize =
            (
                10 +
                Math.random() * 18
            ) + "px";

        element.style.animationDuration =
            (
                8 +
                Math.random() * 12
            ) + "s";

        element.style.animationDelay =
            (
                -Math.random() * 15
            ) + "s";

        document.body.appendChild(
            element
        );
    }
}

createFloatingElements();


/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext = null;

function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }

    return audioContext;
}


/* =========================================================
   BUBBLE POP SOUND
========================================================= */

function playBubblePop() {

    const ctx =
        getAudioContext();

    const now =
        ctx.currentTime;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    const filter =
        ctx.createBiquadFilter();


    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        480,
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        120,
        now + .16
    );


    filter.type =
        "lowpass";

    filter.frequency.setValueAtTime(
        1600,
        now
    );


    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .28,
        now + .008
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .18
    );


    oscillator.connect(filter);

    filter.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + .2
    );


    /* Sparkle */

    const sparkle =
        ctx.createOscillator();

    const sparkleGain =
        ctx.createGain();


    sparkle.type =
        "sine";

    sparkle.frequency.setValueAtTime(
        950,
        now
    );

    sparkle.frequency.exponentialRampToValueAtTime(
        420,
        now + .12
    );


    sparkleGain.gain.setValueAtTime(
        .0001,
        now
    );

    sparkleGain.gain.exponentialRampToValueAtTime(
        .08,
        now + .01
    );

    sparkleGain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .15
    );


    sparkle.connect(
        sparkleGain
    );

    sparkleGain.connect(
        ctx.destination
    );


    sparkle.start(now);

    sparkle.stop(
        now + .18
    );
}


/* =========================================================
   SOFT CAT BELL
========================================================= */

function playCatBell() {

    const ctx =
        getAudioContext();

    const now =
        ctx.currentTime;


    const notes = [

        {
            frequency: 1046.5,
            delay: 0
        },

        {
            frequency: 1318.5,
            delay: .08
        },

        {
            frequency: 1568,
            delay: .16
        }

    ];


    notes.forEach(
        note => {

            const oscillator =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            const delay =
                now +
                note.delay;


            oscillator.type =
                "sine";

            oscillator.frequency.setValueAtTime(
                note.frequency,
                delay
            );


            gain.gain.setValueAtTime(
                .0001,
                delay
            );

            gain.gain.exponentialRampToValueAtTime(
                .16,
                delay + .01
            );

            gain.gain.exponentialRampToValueAtTime(
                .0001,
                delay + .75
            );


            oscillator.connect(
                gain
            );

            gain.connect(
                ctx.destination
            );


            oscillator.start(
                delay
            );

            oscillator.stop(
                delay + .8
            );

        }
    );
}


/* =========================================================
   NO BUTTON
========================================================= */

let noAttempts = 0;

const MAX_ESCAPES = 5;


function tryNo() {

    playTinyNoSound();

    noAttempts++;


    if (
        noAttempts <=
        MAX_ESCAPES
    ) {

        escapeNoButton();


        if (
            noAttempts ===
            MAX_ESCAPES
        ) {

            setTimeout(
                () => {

                    document
                        .getElementById(
                            "pleaseModal"
                        )
                        .classList.add(
                            "show"
                        );

                },
                500
            );
        }
    }
}


/* =========================================================
   IMPROVED MOBILE-SAFE NO BUTTON
========================================================= */

function escapeNoButton() {

    const button =
        document.getElementById(
            "noBtn"
        );


    /* Remove any previous transform
       before measuring */

    button.style.transform =
        "none";


    /* Fixed positioning allows
       movement around the viewport */

    button.style.position =
        "fixed";


    button.style.zIndex =
        "500";


    /* Force layout calculation */

    const buttonWidth =
        button.offsetWidth;

    const buttonHeight =
        button.offsetHeight;


    /*
       SAFE AREA

       The button will never touch
       the edges of the screen.

       This is especially important
       on mobile devices.
    */

    const horizontalMargin =
        20;

    const topMargin =
        85;

    const bottomMargin =
        30;


    /*
       Use visual viewport when
       available.

       This helps when the mobile
       browser's address bar changes
       the visible screen height.
    */

    const viewportWidth =
        window.visualViewport
            ? window.visualViewport.width
            : window.innerWidth;

    const viewportHeight =
        window.visualViewport
            ? window.visualViewport.height
            : window.innerHeight;


    /* Maximum safe coordinates */

    const minX =
        horizontalMargin;

    const maxX =
        Math.max(
            minX,
            viewportWidth -
            buttonWidth -
            horizontalMargin
        );


    const minY =
        topMargin;

    const maxY =
        Math.max(
            minY,
            viewportHeight -
            buttonHeight -
            bottomMargin
        );


    /*
       Random position.

       Because the limits already
       account for button dimensions,
       the complete button remains
       inside the screen.
    */

    const x =
        minX +
        Math.random() *
        Math.max(
            0,
            maxX - minX
        );


    const y =
        minY +
        Math.random() *
        Math.max(
            0,
            maxY - minY
        );


    button.style.left =
        `${Math.round(x)}px`;

    button.style.top =
        `${Math.round(y)}px`;


    /* Small playful rotation */

    const rotation =
        -7 +
        Math.random() * 14;

    button.style.transform =
        `rotate(${rotation}deg)`;
}


/* =========================================================
   SMALL NO SOUND
========================================================= */

function playTinyNoSound() {

    const ctx =
        getAudioContext();

    const now =
        ctx.currentTime;


    const oscillator =
        ctx.createOscillator();

    const gain =
        ctx.createGain();


    oscillator.type =
        "sine";

    oscillator.frequency.setValueAtTime(
        220,
        now
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        170,
        now + .12
    );


    gain.gain.setValueAtTime(
        .0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        .035,
        now + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        now + .14
    );


    oscillator.connect(gain);

    gain.connect(
        ctx.destination
    );


    oscillator.start(now);

    oscillator.stop(
        now + .15
    );
}


/* =========================================================
   MODAL NO → BUBBLE TRANSFORMATION
========================================================= */

function modalNo() {

    document
        .getElementById(
            "pleaseModal"
        )
        .classList.remove(
            "show"
        );


    /* Bubble pop */

    playBubblePop();


    /* Transformation text */

    const message =
        document.getElementById(
            "transformationMessage"
        );

    message.classList.remove(
        "show"
    );

    /* Restart animation */

    void message.offsetWidth;

    message.classList.add(
        "show"
    );


    /* Create bubbles */

    createBubbleBurst();


    /* Turn both into YES */

    setTimeout(
        () => {

            transformButtonsToYes();

        },
        1500
    );
}


/* =========================================================
   BUBBLE BURST
========================================================= */

function createBubbleBurst() {

    const layer =
        document.getElementById(
            "bubbleLayer"
        );


    layer.innerHTML = "";

    layer.classList.add(
        "active"
    );


    /* Get NO button position */

    const button =
        document.getElementById(
            "noBtn"
        );

    const rect =
        button.getBoundingClientRect();


    const originX =
        rect.left +
        rect.width / 2;

    const originY =
        rect.top +
        rect.height / 2;


    /* Burst ring */

    const ring =
        document.createElement(
            "div"
        );

    ring.className =
        "burst-ring";

    ring.style.left =
        originX + "px";

    ring.style.top =
        originY + "px";


    document.body.appendChild(
        ring
    );


    setTimeout(
        () => ring.remove(),
        800
    );


    /* Hide NO */

    button.style.opacity =
        "0";

    button.style.transform =
        "scale(0)";


    /* Bubble quantity */

    const bubbleCount =
        window.innerWidth < 600
            ? 100
            : 160;


    for (
        let i = 0;
        i < bubbleCount;
        i++
    ) {

        const bubble =
            document.createElement(
                "div"
            );

        bubble.className =
            "bubble";


        const size =
            15 +
            Math.random() * 70;


        bubble.style.setProperty(
            "--size",
            size + "px"
        );


        /* Start around button */

        const startX =
            (Math.random() - .5) *
            80;

        const startY =
            (Math.random() - .5) *
            80;


        /* Spread across screen */

        const midX =
            Math.random() *
            window.innerWidth -
            originX;

        const midY =
            Math.random() *
            window.innerHeight -
            originY;


        /* Fly away */

        const endX =
            midX +
            (Math.random() - .5) *
            window.innerWidth *
            1.2;

        const endY =
            midY -
            (150 +
             Math.random() * 700);


        bubble.style.setProperty(
            "--x",
            originX + "px"
        );

        bubble.style.setProperty(
            "--y",
            originY + "px"
        );


        bubble.style.setProperty(
            "--startX",
            startX + "px"
        );

        bubble.style.setProperty(
            "--startY",
            startY + "px"
        );


        bubble.style.setProperty(
            "--midX",
            midX + "px"
        );

        bubble.style.setProperty(
            "--midY",
            midY + "px"
        );


        bubble.style.setProperty(
            "--endX",
            endX + "px"
        );

        bubble.style.setProperty(
            "--endY",
            endY + "px"
        );


        const duration =
            2.4 +
            Math.random() * .9;


        bubble.style.setProperty(
            "--duration",
            duration + "s"
        );


        bubble.style.animationDelay =
            Math.random() * .35 +
            "s";


        layer.appendChild(
            bubble
        );
    }


    /* Second wave */

    setTimeout(
        () => {

            playBubblePop();

            for (
                let i = 0;
                i < 35;
                i++
            ) {

                createSmallBurstBubble(
                    originX,
                    originY,
                    layer
                );
            }

        },
        180
    );
}


/* =========================================================
   SMALL SECONDARY BUBBLES
========================================================= */

function createSmallBurstBubble(
    originX,
    originY,
    layer
) {

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";


    const size =
        8 +
        Math.random() * 30;


    bubble.style.setProperty(
        "--size",
        size + "px"
    );


    bubble.style.setProperty(
        "--x",
        originX + "px"
    );

    bubble.style.setProperty(
        "--y",
        originY + "px"
    );


    bubble.style.setProperty(
        "--startX",
        (
            (Math.random() - .5) *
            30
        ) + "px"
    );

    bubble.style.setProperty(
        "--startY",
        (
            (Math.random() - .5) *
            30
        ) + "px"
    );


    bubble.style.setProperty(
        "--midX",
        (
            (Math.random() - .5) *
            window.innerWidth
        ) + "px"
    );

    bubble.style.setProperty(
        "--midY",
        (
            (Math.random() - .5) *
            window.innerHeight
        ) + "px"
    );


    bubble.style.setProperty(
        "--endX",
        (
            (Math.random() - .5) *
            window.innerWidth *
            1.5
        ) + "px"
    );

    bubble.style.setProperty(
        "--endY",
        (
            -300 -
            Math.random() * 700
        ) + "px"
    );


    bubble.style.setProperty(
        "--duration",
        (
            2.2 +
            Math.random() * .8
        ) + "s"
    );


    layer.appendChild(
        bubble
    );
}


/* =========================================================
   BOTH OPTIONS BECOME YES
========================================================= */

function transformButtonsToYes() {

    const yesBtn =
        document.getElementById(
            "yesBtn"
        );

    const noButton =
        document.getElementById(
            "noBtn"
        );


    /* Existing YES */

    yesBtn.textContent =
        "YES 💕";


    /* Former NO */

    noButton.textContent =
        "YES 💕";


    noButton.classList.remove(
        "no-btn"
    );

    noButton.classList.add(
        "yes-btn"
    );


    noButton.onclick =
        sayYes;


    /* Return to normal flow */

    noButton.style.position =
        "static";

    noButton.style.left =
        "auto";

    noButton.style.top =
        "auto";

    noButton.style.opacity =
        "1";

    noButton.style.transform =
        "none";

    noButton.style.zIndex =
        "auto";

    noButton.style.pointerEvents =
        "auto";

    noButton.disabled =
        false;


    /*
       Bubbles continue flying away
       and disappear after 3 seconds.
    */

    setTimeout(
        () => {

            const layer =
                document.getElementById(
                    "bubbleLayer"
                );

            layer.classList.remove(
                "active"
            );

            layer.innerHTML = "";

        },
        3000
    );
}


/* =========================================================
   YES
========================================================= */

let alreadyYes = false;


function sayYes() {

    if (alreadyYes) {
        return;
    }


    alreadyYes = true;


    /* Cat bell */

    playCatBell();


    /* Disable all buttons */

    document
        .querySelectorAll(
            "button"
        )
        .forEach(
            button => {

                button.disabled =
                    true;

                button.style.pointerEvents =
                    "none";

            }
        );


    /* Celebration */

    createCelebration();


    /* Success screen */

    setTimeout(
        () => {

            document
                .getElementById(
                    "successScreen"
                )
                .classList.add(
                    "show"
                );

        },
        700
    );


    /* Plans popup */

    setTimeout(
        () => {

            document
                .getElementById(
                    "plansPopup"
                )
                .classList.add(
                    "show"
                );

        },
        3300
    );
}


/* =========================================================
   CELEBRATION
========================================================= */

function createCelebration() {

    const shapes = [
        "♥",
        "♡",
        "✦",
        "✧",
        "•"
    ];


    for (
        let i = 0;
        i < 90;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );

        piece.className =
            "confetti";


        piece.textContent =
            shapes[
                Math.floor(
                    Math.random() *
                    shapes.length
                )
            ];


        piece.style.left =
            Math.random() * 100 +
            "vw";


        piece.style.fontSize =
            (
                8 +
                Math.random() * 18
            ) + "px";


        piece.style.animationDuration =
            (
                2.5 +
                Math.random() * 3
            ) + "s";


        piece.style.animationDelay =
            Math.random() * .8 +
            "s";


        document.body.appendChild(
            piece
        );


        setTimeout(
            () => {

                piece.remove();

            },
            6000
        );
    }
}


/* =========================================================
   PLANS POPUP
========================================================= */

function closePlans() {

    document
        .getElementById(
            "plansPopup"
        )
        .classList.remove(
            "show"
        );
}


/* =========================================================
   MOBILE VIEWPORT RESIZE
========================================================= */

/*
   If the mobile browser address bar
   changes the viewport while the NO
   button is moving, keep it inside
   the visible area.
*/

if (window.visualViewport) {

    window.visualViewport.addEventListener(
        "resize",
        () => {

            const button =
                document.getElementById(
                    "noBtn"
                );


            if (
                button &&
                button.style.position ===
                "fixed"
            ) {

                const rect =
                    button.getBoundingClientRect();


                const width =
                    window.visualViewport.width;

                const height =
                    window.visualViewport.height;


                const margin = 20;

                const topSafe = 85;

                const bottomSafe = 30;


                let x =
                    rect.left;

                let y =
                    rect.top;


                x =
                    Math.max(
                        margin,
                        Math.min(
                            x,
                            width -
                            rect.width -
                            margin
                        )
                    );


                y =
                    Math.max(
                        topSafe,
                        Math.min(
                            y,
                            height -
                            rect.height -
                            bottomSafe
                        )
                    );


                button.style.left =
                    `${x}px`;

                button.style.top =
                    `${y}px`;
            }
        }
    );
}


/* =========================================================
   UNLOCK AUDIO ON FIRST TAP
========================================================= */

document.addEventListener(
    "click",
    () => {

        try {

            getAudioContext();

        } catch (error) {

            console.log(
                "Audio unavailable."
            );

        }

    },
    {
        once: true
    }
);
