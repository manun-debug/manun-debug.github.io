<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little Question 💕</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--pink:#df7897;--dark-pink:#c65376;--text:#4b2935;--muted:#8d6671}
    html,body{width:100%;height:100%}
    body{min-height:100vh;overflow:hidden;font-family:"DM Sans",sans-serif;color:var(--text);
      background:radial-gradient(circle at 15% 20%,rgba(255,183,202,.7),transparent 30%),
      radial-gradient(circle at 85% 80%,rgba(213,185,255,.55),transparent 30%),
      linear-gradient(135deg,#fff1f4,#ffe8ee 45%,#f8edff)}
    .background{position:fixed;inset:0;overflow:hidden;pointer-events:none}
    .orb{position:absolute;border-radius:50%;filter:blur(55px);opacity:.45;animation:drift 12s ease-in-out infinite alternate}
    .orb.one{width:260px;height:260px;background:#ffb7c9;left:-80px;top:10%}
    .orb.two{width:320px;height:320px;background:#d9b9ff;right:-110px;bottom:5%;animation-delay:2s}
    .orb.three{width:190px;height:190px;background:#ffd9b8;left:45%;top:-80px;animation-delay:4s}
    @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(45px,35px) scale(1.15)}}
    .floating-heart{position:fixed;bottom:-50px;pointer-events:none;opacity:.5;animation:floatHeart linear forwards;z-index:1}
    @keyframes floatHeart{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.6}100%{transform:translateY(-110vh) rotate(30deg);opacity:0}}
    .page{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px;position:relative;z-index:5}
    .card{width:min(680px,94vw);padding:55px 45px;text-align:center;background:rgba(255,255,255,.57);
      backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,.75);
      border-radius:35px;box-shadow:0 30px 80px rgba(150,72,100,.15),inset 0 1px 0 rgba(255,255,255,.85);
      animation:cardIn 1s cubic-bezier(.16,1,.3,1)}
    @keyframes cardIn{from{opacity:0;transform:translateY(35px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
    .heart-icon{width:80px;height:80px;margin:0 auto 25px;display:flex;justify-content:center;align-items:center;border-radius:50%;
      background:rgba(255,255,255,.75);box-shadow:0 15px 35px rgba(200,92,126,.15);font-size:38px;animation:heartbeat 2s infinite}
    @keyframes heartbeat{0%,100%{transform:scale(1)}10%{transform:scale(1.08)}20%{transform:scale(1)}30%{transform:scale(1.08)}40%{transform:scale(1)}}
    .small-title{text-transform:uppercase;letter-spacing:4px;font-size:11px;color:var(--muted);margin-bottom:15px;font-weight:600}
    h1{font-family:"Playfair Display",serif;font-size:clamp(32px,6vw,52px);line-height:1.15;margin-bottom:20px}
    .question{min-height:120px;font-family:"Playfair Display",serif;font-size:clamp(20px,4vw,27px);line-height:1.5;color:#633744}
    .cursor{border-right:2px solid var(--dark-pink);animation:blink .7s infinite}
    @keyframes blink{50%{border-color:transparent}}
    .buttons{margin-top:35px;display:flex;justify-content:center;align-items:center;gap:18px;min-height:65px}
    button{border:none;cursor:pointer;font-family:"DM Sans",sans-serif;font-size:16px;font-weight:700;padding:16px 32px;border-radius:999px;transition:.25s ease;position:relative;overflow:hidden}
    button:disabled{cursor:default}
    .yes{color:white;background:linear-gradient(135deg,#df7897,#c95678);box-shadow:0 12px 30px rgba(201,86,120,.28)}
    .yes:hover:not(:disabled){transform:translateY(-4px) scale(1.04);box-shadow:0 18px 38px rgba(201,86,120,.38)}
    .no{color:#784654;background:rgba(255,255,255,.78);border:1px solid rgba(200,92,126,.18)}
    .no:hover:not(:disabled){transform:translateY(-3px)}
    .modal,.plans-popup{position:fixed;inset:0;justify-content:center;align-items:center}
    .modal{z-index:100;display:none;background:rgba(65,28,40,.25);backdrop-filter:blur(12px)}
    .modal.active,.plans-popup.active{display:flex}
    .modal-card{width:min(420px,88vw);padding:45px 30px;text-align:center;background:rgba(255,255,255,.93);border-radius:30px;
      box-shadow:0 30px 100px rgba(80,25,45,.25);animation:modalIn .55s cubic-bezier(.16,1,.3,1)}
    @keyframes modalIn{from{opacity:0;transform:scale(.75) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
    .modal-card h2{font-family:"Playfair Display",serif;font-size:42px;margin-bottom:25px}
    .modal-buttons{display:flex;justify-content:center;gap:15px}
    .crash{position:fixed;inset:0;z-index:200;display:none;justify-content:center;align-items:center;background:#080808;color:white;font-family:monospace}
    .crash.active{display:flex}.crash-content{text-align:center;animation:glitch .12s infinite}
    .crash-title{font-size:clamp(25px,5vw,50px);margin-bottom:15px}.crash-sub{color:#ff9bb7;font-size:15px}
    @keyframes glitch{0%{transform:translate(0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}100%{transform:translate(0)}}
    .success{position:fixed;inset:0;z-index:300;display:none;justify-content:center;align-items:center;text-align:center;
      background:radial-gradient(circle at center,rgba(255,255,255,.95),transparent 45%),linear-gradient(135deg,#ffe8ef,#f7eaff)}
    .success.active{display:flex;animation:successIn .8s ease}
    @keyframes successIn{from{opacity:0}to{opacity:1}}
    .success-content{padding:30px;animation:successContentIn 1s cubic-bezier(.16,1,.3,1)}
    @keyframes successContentIn{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
    .big-heart{font-size:100px;animation:heartPop 1s cubic-bezier(.16,1,.3,1)}
    @keyframes heartPop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
    .success h2{font-family:"Playfair Display",serif;font-size:clamp(48px,10vw,90px);color:#c65376}
    .success-main{margin-top:10px;font-family:"Playfair Display",serif;font-size:clamp(24px,5vw,34px);color:#643744}
    .plans-popup{position:fixed;z-index:500;display:none;background:rgba(70,30,45,.18);backdrop-filter:blur(8px)}
    .plans-card{width:min(430px,88vw);padding:40px 30px;text-align:center;background:rgba(255,255,255,.94);
      border:1px solid rgba(255,255,255,.9);border-radius:30px;box-shadow:0 30px 100px rgba(80,25,45,.22);
      animation:plansIn .65s cubic-bezier(.16,1,.3,1)}
    @keyframes plansIn{0%{opacity:0;transform:translateY(40px) scale(.75) rotate(-3deg)}70%{transform:translateY(-5px) scale(1.03) rotate(1deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
    .plans-icon{width:70px;height:70px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border-radius:50%;
      background:linear-gradient(135deg,#ffe1e9,#f0ddff);font-size:32px;animation:heartbeat 2s infinite}
    .plans-card h3{font-family:"Playfair Display",serif;font-size:clamp(28px,7vw,40px);color:#c65376;margin-bottom:12px}
    .plans-card p{font-family:"Playfair Display",serif;font-size:23px;line-height:1.4;color:#633744}
    .plans-close{margin-top:25px;padding:12px 26px;font-size:14px;color:#784654;background:rgba(255,232,239,.8);border:1px solid rgba(200,92,126,.15)}
    .confetti{position:fixed;width:9px;height:14px;z-index:400;pointer-events:none;animation:confettiFall 2.8s linear forwards}
    @keyframes confettiFall{from{transform:translateY(-20px) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:0}}
    @media(max-width:600px){.card{padding:40px 23px}.heart-icon{width:65px;height:65px;font-size:30px}.buttons{gap:12px}button{padding:14px 24px}.question{min-height:160px}.big-heart{font-size:80px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="background"><div class="orb one"></div><div class="orb two"></div><div class="orb three"></div></div>

  <main class="page">
    <section class="card">
      <div class="heart-icon">💗</div>
      <div class="small-title">A very important question</div>
      <h1>Hey you…</h1>
      <div class="question"><span id="typedText"></span><span class="cursor"></span></div>
      <div class="buttons">
        <button class="yes" id="mainYes" onclick="sayYes()">YES 💕</button>
        <button class="no" id="noButton" onclick="tryNo()">NO 🙈</button>
      </div>
    </section>
  </main>

  <div class="modal" id="pleaseModal">
    <div class="modal-card">
      <h2>please🥺🥺</h2>
      <div class="modal-buttons">
        <button class="yes" onclick="sayYes()">YES 💗</button>
        <button class="no" onclick="modalNo()">NO 😭</button>
      </div>
    </div>
  </div>

  <div class="crash" id="crashScreen">
    <div class="crash-content">
      <div class="crash-title">DATE_REQUEST.exe</div>
      <div class="crash-sub">has stopped resisting...</div>
    </div>
  </div>

  <div class="success" id="successScreen">
    <div class="success-content">
      <div class="big-heart">💕</div>
      <h2>YAY!</h2>
      <div class="success-main">It’s a date! 🥰</div>
    </div>
  </div>

  <div class="plans-popup" id="plansPopup">
    <div class="plans-card">
      <div class="plans-icon">💌</div>
      <h3>One last thing…</h3>
      <p>Text me... to know plans 💕</p>
      <button class="plans-close" onclick="closePlans()">Okay 🥰</button>
    </div>
  </div>

  <script>
    const message = "I’ve been trying to focus all day, but I keep getting distracted by how much I want to take you out. Will you go on a date with me?";
    const typedText = document.getElementById("typedText");
    let characterIndex = 0;

    function typeMessage(){
      if(characterIndex < message.length){
        typedText.textContent += message.charAt(characterIndex++);
        setTimeout(typeMessage,35);
      }
    }
    setTimeout(typeMessage,900);

    const heartSymbols=["♡","♥","💕","💗","💖","✦","✨"];
    function createHeart(){
      const heart=document.createElement("div");
      heart.className="floating-heart";
      heart.textContent=heartSymbols[Math.floor(Math.random()*heartSymbols.length)];
      heart.style.left=Math.random()*100+"vw";
      heart.style.fontSize=12+Math.random()*18+"px";
      heart.style.animationDuration=7+Math.random()*8+"s";
      document.body.appendChild(heart);
      setTimeout(()=>heart.remove(),15000);
    }
    setInterval(createHeart,700);

    const noButton=document.getElementById("noButton");
    let noAttempts=0;

    function tryNo(){
      noAttempts++;
      if(noAttempts<=2){
        escapeNoButton();
        if(noAttempts===2){
          setTimeout(()=>document.getElementById("pleaseModal").classList.add("active"),450);
        }
      }
    }

    function escapeNoButton(){
      const padding=20;
      const buttonWidth=noButton.offsetWidth;
      const buttonHeight=noButton.offsetHeight;
      const maxX=window.innerWidth-buttonWidth-padding;
      const maxY=window.innerHeight-buttonHeight-padding;
      const x=padding+Math.random()*Math.max(0,maxX-padding);
      const y=padding+Math.random()*Math.max(0,maxY-padding);

      noButton.style.position="fixed";
      noButton.style.left=x+"px";
      noButton.style.top=y+"px";
      noButton.style.zIndex="50";
      noButton.animate(
        [{transform:"scale(.7) rotate(-10deg)",opacity:.5},
         {transform:"scale(1.15) rotate(5deg)",opacity:1},
         {transform:"scale(1) rotate(0)"}],
        {duration:400,easing:"cubic-bezier(.16,1,.3,1)"}
      );
    }

    function modalNo(){
      document.getElementById("pleaseModal").classList.remove("active");
      const crash=document.getElementById("crashScreen");
      crash.classList.add("active");

      document.body.animate(
        [{transform:"translateX(0)"},{transform:"translateX(-8px)"},
         {transform:"translateX(8px)"},{transform:"translateX(-5px)"},
         {transform:"translateX(0)"}],
        {duration:450}
      );

      setTimeout(()=>{
        crash.classList.remove("active");
        document.getElementById("mainYes").textContent="YES 💕";
        noButton.textContent="YES 💕";
        noButton.className="yes";
        noButton.onclick=sayYes;
        noButton.style.position="static";
      },2300);
    }

    async function sayYes(){
      document.querySelectorAll("button").forEach(button=>button.disabled=true);
      createCelebration();

      setTimeout(()=>{
        document.getElementById("successScreen").classList.add("active");
        setTimeout(()=>document.getElementById("plansPopup").classList.add("active"),2600);
      },700);
    }

    function closePlans(){
      document.getElementById("plansPopup").classList.remove("active");
    }

    function createCelebration(){
      const symbols=["💕","💗","💖","♥","✦","✨","🌸"];
      for(let i=0;i<100;i++){
        setTimeout(()=>{
          const particle=document.createElement("div");
          particle.className="confetti";
          particle.textContent=symbols[Math.floor(Math.random()*symbols.length)];
          particle.style.left=Math.random()*100+"vw";
          particle.style.top="-20px";
          particle.style.fontSize=12+Math.random()*20+"px";
          particle.style.animationDuration=1.8+Math.random()*2+"s";
          document.body.appendChild(particle);
          setTimeout(()=>particle.remove(),4500);
        },i*20);
      }
    }

    window.addEventListener("resize",()=>{
      if(noButton.style.position==="fixed"){
        const rect=noButton.getBoundingClientRect();
        if(rect.right>window.innerWidth||rect.bottom>window.innerHeight){
          noButton.style.left=Math.max(10,window.innerWidth-noButton.offsetWidth-20)+"px";
          noButton.style.top=Math.max(10,window.innerHeight-noButton.offsetHeight-20)+"px";
        }
      }
    });
  </script>
</body>
</html>
